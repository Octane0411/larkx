name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run core verification
        run: |
          go vet ./...
          go test -count=1 . ./shortcuts/doc/... ./cmd/takeover/... ./cmd/update/... ./internal/skillscheck/...

      - name: Build release archives
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          LDFLAGS="-s -w -X github.com/larksuite/cli/internal/build.Version=${TAG} -X github.com/larksuite/cli/internal/build.Date=${DATE}"
          mkdir -p dist

          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            STAGE="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" -o "${STAGE}/larkx" .
            cp LICENSE README.md "${STAGE}/"
            tar -C "$STAGE" -czf "dist/larkx_${TAG}_${GOOS}_${GOARCH}.tar.gz" larkx LICENSE README.md
            rm -rf "$STAGE"
          done

          (cd dist && sha256sum *.tar.gz > checksums.txt)
          ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
